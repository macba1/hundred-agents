# Deploy 24/7 del agente de WhatsApp en Fly.io.
# URL fija: https://<app>.fly.dev  ·  SQLite en volumen persistente /data.
#
# Los secretos NO van aquí: se cargan con `fly secrets set` (ver deploy_fly.sh).
app = "sanmi-whatsapp-agent"
primary_region = "qro"          # Querétaro: lo más cercano a San Miguel el Alto

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/agent.db"
  WHATSAPP_API_VERSION = "v20.0"
  TRANSCRIBE_MODEL = "whisper-1"
  OPENAI_MODEL = "gpt-4o"

[mounts]
  source = "agent_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # El webhook de Meta debe contestar SIEMPRE en <5s: la máquina no se suspende.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
